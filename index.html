<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boutique</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
color:white;
}

header{
padding:80px 20px 50px;
text-align:center;
}

h1{
font-size:60px;
margin-bottom:20px;
text-transform:uppercase;
}

.tagline{
font-size:28px;
font-weight:700;
color:#FFD700;
margin-bottom:15px;
}

.sous-titre{
color:#bdbdbd;
font-size:20px;
}

.produits{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:35px;
padding:60px;
max-width:1400px;
margin:auto;
}

.carte{
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.12);
border-radius:25px;
overflow:hidden;
transition:.35s;
}

.carte:hover{
transform:translateY(-8px);
box-shadow:0 0 40px rgba(255,215,0,.25);
}

.carte img{
width:100%;
height:350px;
object-fit:cover;
}

.info{
padding:25px;
text-align:center;
}

.info h2{
margin-bottom:10px;
}

.prix{
font-size:26px;
font-weight:bold;
margin:20px 0;
color:#FFD700;
}

button{
width:100%;
padding:18px;
background:#FFD700;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
}

</style>

</head>

<body>

<header>

<div class="tagline">
🔥 TU NE PEUX PAS ÊTRE DÉÇU 🔥
</div>

<h1>Notre Boutique</h1>

<p class="sous-titre">
Choisis le produit qui te correspond.
</p>

</header>

<section class="produits">

<div class="carte">

<img src="DD4ADE36-1821-474B-9F4A-A9B4E653EDFC.webp">

<div class="info">

<h2>Produit n°1</h2>

<p class="prix">19,99 €</p>

<button>Ajouter au panier</button>

</div>

</div>

</section>

</body>
</html>
